# Dependabot keeps dependencies patched automatically.
# Grouping minor/patch updates means one reviewable PR per week instead of
# an alert storm — this is what ends the whack-a-mole.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Major version bumps still arrive as individual PRs, so breaking
    # changes are reviewed on their own.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
