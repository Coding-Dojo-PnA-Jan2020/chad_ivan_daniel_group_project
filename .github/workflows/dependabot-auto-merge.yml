name: Dependabot auto-merge

# The whack-a-mole killer: Dependabot's grouped minor/patch PRs (the ones
# titled "Bump the <group> group with N updates") merge themselves once the
# full CI — tests, lint, pip-audit, Trivy, Docker smoke test — is green.
# Major version bumps never auto-merge; a human reviews those.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for grouped minor/patch updates
        if: contains(github.event.pull_request.title, 'group')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
