name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: whisper:ci

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests wsgi.py

      - name: Test (pytest)
        run: pytest -q

      - name: Dependency audit (pip-audit)
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-dev.txt --progress-spinner off

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan (secrets & IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy Dockerfile misconfig check
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the container for real)
        run: |
          docker run -d --name whisper-smoke \
            -e SECRET_KEY=ci-smoke-secret-not-for-prod \
            -p 8000:8000 "${{ env.IMAGE_NAME }}"
          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::Container failed to become healthy"
            docker logs whisper-smoke
            docker rm -f whisper-smoke
            exit 1
          fi
          echo "Container healthy ✔"
          docker rm -f whisper-smoke

      - name: Trivy image scan (gate on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
