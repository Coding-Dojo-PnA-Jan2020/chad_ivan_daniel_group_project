{% extends "base.html" %}
{% block title %}Reset password — Whisper 🤫{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow whisper-card">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Reset your password 🔑</h1>
        <p class="text-muted">Enter your email and we'll generate a password reset token.</p>
        <form method="post" action="{{ url_for('auth.reset_request') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <button class="btn btn-primary w-100">Send reset token</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
